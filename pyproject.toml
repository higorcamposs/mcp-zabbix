[project]
name = "mcp-zabbix"
version = "0.1.0"
description = "MCP Server para consultar e gerenciar um Zabbix (hosts, itens, triggers, problemas e manutenções) pela API JSON-RPC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # SDK oficial Python do MCP (linha 2.x).
    "mcp==2.3.0",
    # Cliente HTTP assincrono; ja e dependencia direta do SDK.
    "httpx2==2.13.1",
    "pydantic==2.14.1",
]

[project.scripts]
mcp-zabbix = "mcp_zabbix.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # Fornece o plugin pytest usado pelos testes assincronos (@pytest.mark.anyio).
    "anyio==4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_zabbix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
